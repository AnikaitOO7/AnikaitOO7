# ─────────────────────────────────────────────────────────────────────────────
#  MISSION METRICS — generates every stats image in README section [06]
#  as a static SVG committed to ./profile/, so the README never depends on a
#  public stats endpoint (which is what broke: the hosted card returned
#  "Failed to retrieve contributions. This is likely a GitHub API issue.")
#
#  Lives in your PROFILE repo (AnikaitOO7/AnikaitOO7) at
#  .github/workflows/metrics.yml — run it once from the Actions tab
#  ("Run workflow") and the images appear; afterwards it refreshes daily.
# ─────────────────────────────────────────────────────────────────────────────
name: Update mission metrics

on:
  schedule:
    - cron: "0 3 * * *"            # daily, 03:00 UTC
  workflow_dispatch:               # manual run from the Actions tab
  push:
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # needed to push the generated SVGs

    steps:
      - uses: actions/checkout@v6

      # ── GitHub stats card (same options as the old vercel URL) ─────────────
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&title_color=00d2ff&icon_color=00d2ff&text_color=ffffff&bg_color=0d1117&rank_icon=github&show=reviews,discussions_started
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Top languages card ─────────────────────────────────────────────────
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&hide=html,css&title_color=00d2ff&text_color=ffffff&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Contribution streak card ───────────────────────────────────────────
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0d1117&ring=00d2ff&fire=00d2ff&currStreakLabel=00d2ff&sideLabels=00d2ff&dates=4a9eff&stroke=001a33
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Animated contribution snake (dark + light variants) ────────────────
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?color_snake=#00d2ff&color_dots=#161b22,#0b4a5c,#0a7f96,#00b3d6,#00d2ff
            profile/snake-light.svg?color_snake=#0077b5&color_dots=#ebedf0,#9be9ff,#4fd3f5,#00b3d6,#0077b5

      # ── Commit whatever changed ────────────────────────────────────────────
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update mission metrics" || exit 0
          git push
